{% extends 'base.html' %}
{% block body %}
    <div class="container">
        <h1 class="text-center">Login Form</h1>
        {{ form.non_field_errors }}
        <form method="post">
            {% csrf_token %}
            {% for field in form %}
                <label class ="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
                {{ field }}  
                {{ field.errors }}      
            {% endfor %}
            <button type="submit" class="btn btn-primary">Login</button>
        </form>
    </div>
{% endblock %}
